version: '3.8'

services:
  recommendation-service:
    build: .
    container_name: recommendation-system
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - recommendation-network

  redis:
    image: redis:7-alpine
    container_name: recommendation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - recommendation-network

networks:
  recommendation-network:
    driver: bridge

volumes:
  redis-data: